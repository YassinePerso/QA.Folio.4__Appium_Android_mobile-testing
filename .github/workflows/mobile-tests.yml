name: Mobile Tests

on:
  push:
    branches: [First_commit]
  pull_request:
    branches: [First_commit]

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Python dependencies
        run: |
          pip install Appium-Python-Client pytest

      - name: Download app APK
        run: |
          curl -L -o mda.apk https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk

      - name: Run tests on Android emulator (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install mda.apk
            appium &
            sleep 10
            pytest tests/ -v

      - name: Run tests on Android emulator (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install mda.apk
            appium &
            sleep 10
            pytest tests/ -v

      - name: Run tests on Android emulator (attempt 3, final)
        if: steps.attempt2.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install mda.apk
            appium &
            sleep 10
            pytest tests/ -v